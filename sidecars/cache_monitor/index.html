<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; frame-src 'none'; child-src 'none'">
  <title>Cache Monitor</title>
  <script src="/preload.js"></script>
  <link rel="stylesheet" href="/styles.css?v=9">
  <script defer src="/app.js?v=9"></script>
</head>
<body>
  <div id="app" class="shell">
    <header class="topbar">
      <div class="topbar-left">
        <span class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <ellipse cx="12" cy="5" rx="8" ry="3"/>
            <path d="M4 5v6c0 1.66 3.58 3 8 3s8-1.34 8-3V5"/>
            <path d="M4 11v6c0 1.66 3.58 3 8 3s8-1.34 8-3v-6"/>
          </svg>
        </span>
        <span class="brand-title">Cache Monitor</span>
        <span id="model-pill" class="model-pill hidden"></span>
      </div>
      <div class="topbar-right">
        <button id="btn-lang" type="button" class="toggle-btn lang-btn" title="Switch to Chinese (简体中文)">中文</button>
        <button id="btn-compact" type="button" class="toggle-btn" aria-pressed="false" title="Toggle compact view (keep KPI cards only)">Compact</button>
        <span id="live-pill" class="live-pill" title="Auto-checks for updates every 1.5s">
          <span class="live-dot" aria-hidden="true"></span>
          <span id="live-text">Live</span>
        </span>
      </div>
    </header>

    <section id="empty-state" class="empty-card">
      <div class="empty-title" id="empty-title">Waiting for session</div>
      <div class="empty-desc" id="empty-desc">Send a message and wait for a model response to view per-step and session cache hit rates.</div>
    </section>

    <main id="dashboard" class="dashboard hidden">
      <section id="kpi-grid" class="kpi-grid" aria-label="Core metrics">
        <article id="kpi-step" class="kpi-card">
          <div class="kpi-head">
            <span class="kpi-label" id="step-label">Step #0</span>
            <span class="kpi-badge muted" id="step-badge">--</span>
          </div>
          <div class="kpi-value-row">
            <span class="kpi-pct" id="step-pct">--</span>
          </div>
          <div class="bar-track" aria-hidden="true">
            <div class="bar-fill" id="step-bar"></div>
          </div>
          <div class="kpi-sub" id="step-sub">0 / 0</div>
        </article>

        <article id="kpi-total" class="kpi-card">
          <div class="kpi-head">
            <span class="kpi-label" id="total-label">Total · Σ Session</span>
            <span class="kpi-badge muted" id="total-badge">0 steps</span>
          </div>
          <div class="kpi-value-row">
            <span class="kpi-pct" id="total-pct">--</span>
          </div>
          <div class="bar-track" aria-hidden="true">
            <div class="bar-fill" id="total-bar"></div>
          </div>
          <div class="kpi-sub" id="total-sub">0 / 0</div>
        </article>

        <article id="kpi-ttft" class="kpi-card kpi-card-perf">
          <div class="kpi-head">
            <span class="kpi-label" id="ttft-label">TTFT · First Token</span>
            <span class="kpi-badge muted" id="ttft-badge">--</span>
          </div>
          <div class="kpi-value-row">
            <span class="kpi-pct" id="ttft-val">--</span>
          </div>
          <div class="kpi-sub" id="ttft-sub">P50 -- · P95 --</div>
        </article>

        <article id="kpi-tps" class="kpi-card kpi-card-perf">
          <div class="kpi-head">
            <div id="tps-switch" class="tps-mode-switch" role="tablist" aria-label="Throughput mode">
              <button type="button" class="tps-mode-btn active" role="tab" aria-selected="true" data-tps-mode="e2e" id="tps-mode-e2e" title="End-to-end throughput: output tokens ÷ total model duration (TTFT + generation)">E2E</button>
              <button type="button" class="tps-mode-btn" role="tab" aria-selected="false" data-tps-mode="decode" id="tps-mode-decode" title="Pure decode speed: output tokens ÷ streaming generation duration (short packets marked burst)">Decode</button>
            </div>
            <span class="kpi-badge muted" id="tps-badge">--</span>
          </div>
          <div class="kpi-value-row">
            <span class="kpi-pct" id="tps-val">--</span>
            <span class="kpi-unit hidden" id="tps-unit">tok/s</span>
          </div>
          <div class="kpi-sub" id="tps-sub">Session --</div>
        </article>
      </section>

      <section id="context-card" class="panel-card context-card hidden" aria-label="Context window">
        <div class="context-head">
          <button id="btn-context-toggle" type="button" class="context-toggle" aria-expanded="false" aria-controls="context-breakdown">
            <span class="panel-title" id="context-label">Context Window</span>
            <span class="context-chevron" id="context-chevron" aria-hidden="true">▾</span>
          </button>
          <div class="context-nums">
            <span id="context-compact-badge" class="kpi-badge compact-ev hidden"></span>
            <span id="context-usage" class="mono muted">-- / --</span>
            <span id="context-pct-badge" class="kpi-badge">--</span>
          </div>
        </div>
        <div id="context-bar" class="ctx-bar-track" aria-hidden="true"></div>
        <div id="context-legend" class="ctx-legend"></div>
        <div id="context-breakdown" class="ctx-breakdown hidden">
          <div id="context-cat-pills" class="ctx-cat-pills" role="tablist" aria-label="Context category"></div>
          <div id="context-items" class="ctx-items"></div>
        </div>
      </section>

      <section id="trend-card" class="panel-card">
        <div class="panel-head">
          <div id="metric-switch" class="metric-switch" role="tablist" aria-label="Trend metric">
            <button type="button" class="metric-btn active" role="tab" aria-selected="true" data-metric="hit" id="metric-hit">Hit Rate</button>
            <button type="button" class="metric-btn" role="tab" aria-selected="false" data-metric="ttft" id="metric-ttft">TTFT</button>
            <button type="button" class="metric-btn" role="tab" aria-selected="false" data-metric="tps" id="metric-tps">tok/s</button>
            <button type="button" class="metric-btn hidden" role="tab" aria-selected="false" data-metric="ctx" id="metric-ctx">Ctx</button>
          </div>
          <span class="panel-meta" id="trend-meta">80% · 50% ref</span>
        </div>
        <div class="chart-wrap">
          <div id="trend-chart" class="trend-chart"></div>
          <div id="chart-tooltip" class="chart-tooltip hidden" role="tooltip"></div>
        </div>
      </section>

      <section id="detail-card" class="panel-card detail-card">
        <div id="tabs-bar" class="tabs-bar" role="tablist" aria-label="Detail views">
          <button type="button" class="tab-btn active" role="tab" aria-selected="true" data-tab="steps" id="tab-steps">Steps (0)</button>
          <button type="button" class="tab-btn" role="tab" aria-selected="false" data-tab="models" id="tab-models">By Model (0)</button>
          <button type="button" class="tab-btn" role="tab" aria-selected="false" data-tab="tools" id="tab-tools">Tools (0)</button>
        </div>
        <div id="detail-body" class="detail-body"></div>
      </section>
    </main>
  </div>
</body>
</html>
